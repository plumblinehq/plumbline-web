# Render Blueprint for plumbline-web. Create it from the dashboard:
# "New +" → "Blueprint" → this repo, branch main. There is nothing to fill in;
# the service is static and the API base URL is set below.
#
# The API lives on Render too (plumbline-server, region Ohio), but static sites
# are served from a global CDN with no region of their own, so there is no
# region to keep in sync here.
#
# Static sites are free and do not spin down, unlike the API's free web
# service, so this directory stays up while the API behind it cold starts.
services:
  - type: web
    name: plumbline-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: '24'
      # Read at build time and baked into the bundle. The CI build job asserts
      # this variable actually reaches the output, because a host that sets it
      # and a build that ignores it produces a site reading the fallback API
      # with no visible symptom until the two drift apart.
      - key: VITE_API_BASE
        value: https://plumbline-server.onrender.com
    routes:
      # Client-side routing. A rewrite keeps the URL the reader typed and lets
      # the router resolve it; a redirect would send /anchor/foo to / and break
      # every permalink this site exists to provide.
      - type: rewrite
        source: /*
        destination: /index.html
